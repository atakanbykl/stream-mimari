# ==============================================================================
# STREAM-MIMARI | NODE-1 ÇALIŞMA ZAMANI YAPILANDIRMASI (application.properties)
# ==============================================================================
# Bu dosya çalışma dizinindedir. Buradaki değerleri değiştirerek projeyi
# YENİDEN DERLEMEDEN farklı topic'lerle veya farklı bir NATS sunucusunda çalıştırabilirsiniz.
# ==============================================================================

# 1. NATS Sunucu Bağlantı Ayarları
nats.url=nats://127.0.0.1:4222
nats.connection.name=node-1-car-gateway
nats.reconnect.wait.seconds=2
nats.max.reconnects=-1

# 2. JetStream Stream Yapılandırması
nats.stream.name=STREAM_MIMARI
nats.stream.subjects=stream.>
nats.stream.storage=file
nats.stream.allow.direct=true
nats.stream.replicas=1

# 3. Yayınlanacak Konular (Publish Topics & Intervals)
publish.telemetry.topic=core.car.telemetry
publish.status.topic=stream.car.status
publish.alerts.topic=core.car.alerts
publish.interval.ms=1000

# 4. Dinlenecek Konular (Subscribe Topics)
subscribe.commands.topic=core.car.commands
subscribe.radar.topic=core.car.sensors.radar
subscribe.weather.topic=stream.weather.current
subscribe.weather.deliver.policy=new
subscribe.weather.auto.ack=true
subscribe.profile.topic=stream.driver.profile
subscribe.profile.deliver.policy=new
subscribe.profile.auto.ack=true

# 5. Geçmişten Çekilecek Konu (Direct Get)
history.maintenance.topic=stream.car.maintenance

# 6. İş Mantığı Eşik Değerleri
vehicle.radar.emergency.distance.meters=20.0
vehicle.radar.emergency.speed.kmh=30.0
vehicle.maintenance.min.brakepad.percent=25.0
vehicle.maintenance.min.oillife.percent=20.0
