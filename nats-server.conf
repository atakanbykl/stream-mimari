# ==============================================================================
# STREAM-MIMARI NATS & JETSTREAM SUNUCU YAPILANDIRMASI (nats-server.conf)
# ==============================================================================
# Bu dosya, stream-mimari projesinin çift katmanlı mimarisi (NATS Core ultra düşük
# gecikme + JetStream kalıcı hafıza ve Direct-Get) için özel olarak optimize edilmiştir.
# ==============================================================================

# 1. Sunucu Tanımı ve Ağ Portları
server_name: "stream-mimari-nats"
host: "0.0.0.0"
port: 4222

# 2. HTTP Gözlem ve İzleme Portu (Monitoring & Metrics)
# Tarayıcıdan açıp sistem durumunu ve akışları canlı izleyebilirsiniz:
# - http://localhost:8222/varz  -> Genel sunucu durumu ve CPU/RAM kullanımı
# - http://localhost:8222/jsz   -> JetStream stream bilgileri, mesaj sayıları ve hafıza
# - http://localhost:8222/connz -> Bağlı node'lar (node-1, node-2 vb.)
# - http://localhost:8222/subsz -> Aktif abonelikler ve konu (subject) dağılımı
http_port: 8222

# 3. JetStream Kalıcı Durum Hafızası (State Store & Event Stream)
# stream-mimari mimarisinde 'stream.*' topicleri ve getLastMessage (Direct Get)
# sorguları için JetStream zorunludur.
jetstream {
    # Kalıcı stream mesajlarının ve indekslerin diske yazılacağı yerel dizin
    store_dir: "./nats-data"

    # Bellekte (RAM) tutulabilecek maksimum JetStream veri boyutu
    max_mem: 1G

    # Diskte tutulabilecek maksimum JetStream veri boyutu
    max_file: 10G
}

# 4. Performans ve Paket Limitleri
# Canlı telemetri, toplu durum veya büyük JSON paketleri için tavan değerler
max_payload: 8MB
max_connections: 64000
write_deadline: "10s"

# 5. Heartbeat & Bağlantı Sağlık Kontrolü
ping_interval: "2m"
ping_max: 5

# 6. Loglama Ayarları
logtime: true
logtime_utc: false
debug: false
trace: false
